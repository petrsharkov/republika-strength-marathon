name: Deploy to VPS
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check server configuration
        id: config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -z "$HOST" || -z "$USER" || -z "$KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - name: Build and check container
        if: steps.config.outputs.ready == 'true'
        run: |
          docker build -f deploy/Dockerfile -t "republika-marathon:$GITHUB_SHA" .
          docker run -d --name marathon-test "republika-marathon:$GITHUB_SHA"
          for attempt in {1..40}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' marathon-test)
            if [[ "$status" == healthy ]]; then break; fi
            if [[ "$status" == unhealthy ]]; then docker logs marathon-test; exit 1; fi
            sleep 3
          done
          [[ "$(docker inspect -f '{{.State.Health.Status}}' marathon-test)" == healthy ]]
          docker rm -f marathon-test
          docker save "republika-marathon:$GITHUB_SHA" | gzip > marathon-image.tar.gz
      - name: Upload and deploy via SSH
        if: steps.config.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$port" =~ ^[0-9]+$ ]] && (( port > 0 && port <= 65535 ))
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="republika-deploy/incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_args[@]}" -p "$port" "$target" "mkdir -p ~/$remote_dir"
          scp "${ssh_args[@]}" -P "$port" marathon-image.tar.gz deploy/deploy.sh "$target:$remote_dir/"
          ssh "${ssh_args[@]}" -p "$port" "$target" "bash ~/$remote_dir/deploy.sh '$GITHUB_SHA' ~/$remote_dir/marathon-image.tar.gz"
          ssh "${ssh_args[@]}" -p "$port" "$target" "rm -f ~/$remote_dir/marathon-image.tar.gz ~/$remote_dir/deploy.sh; rmdir ~/$remote_dir"
          echo "Deployed commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
